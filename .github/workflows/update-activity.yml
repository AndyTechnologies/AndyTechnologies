name: 🔄 Actualizar Perfil

on:
  schedule:
    - cron: "0 0 * * 0"   # Domingo a las 00:00 UTC
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ─── Generar métricas SVG ───────────────────────────
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 🔽 Checkout
        uses: actions/checkout@v4

      - name: 📊 Generar métricas
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          base: header, activity, community, repositories, metadata
          base_indepth: yes
          plugin_languages: yes
          plugin_languages_details: bytes, percentage
          plugin_languages_limit: 6

      - name: 📦 Commit metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics.svg
          git diff --quiet && git diff --staged --quiet || git commit -m "⚡ Actualizar métricas del perfil"
          git push
        continue-on-error: true

  # ─── Actualizar actividad reciente ─────────────────
  activity:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 🔽 Checkout
        uses: actions/checkout@v4

      - name: 📋 Actualizar actividad en README
        run: |
          # ── Obtener últimos eventos ──────────────────────────
          EVENTS=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/users/AndyTechnologies/events/public?per_page=20")

          # ── Generar markdown ─────────────────────────────────
          ACTIVITY=""
          COUNT=0
          for row in $(echo "$EVENTS" | jq -r '.[] | @base64'); do
            [ "$COUNT" -ge 15 ] && break
            _jq() { echo "$row" | base64 -d | jq -r "${1}"; }

            TYPE=$(_jq '.type')
            REPO=$(_jq '.repo.name')
            CREATED=$(_jq '.created_at' | cut -dT -f1)

            case "$TYPE" in
              PushEvent)
                COUNT=$((COUNT+1))
                REF=$(echo "$(_jq '.payload.ref')" | sed 's|refs/heads/||')
                COMMITS=$(_jq '.payload.commits | length')
                if [ "$COMMITS" -gt 0 ]; then
                  MSG=$(echo "$(_jq '.payload.commits[0].message')" | head -c 60)
                  ACTIVITY="${ACTIVITY}* 🚀 Pushed ${COMMITS} commit(s) to \`${REF}\` in [${REPO}](https://github.com/${REPO}) — ${MSG}
        "
                fi
                ;;
              CreateEvent)
                COUNT=$((COUNT+1))
                REF_TYPE=$(_jq '.payload.ref_type')
                REF_NAME=$(_jq '.payload.ref')
                [ "$REF_TYPE" = "repository" ] && \
                  ACTIVITY="${ACTIVITY}* 📦 Created repository [${REPO}](https://github.com/${REPO})
        " || \
                  ACTIVITY="${ACTIVITY}* 🌿 Created ${REF_TYPE} \`${REF_NAME}\` in [${REPO}](https://github.com/${REPO})
        "
                ;;
              IssuesEvent)
                COUNT=$((COUNT+1))
                ACTION=$(_jq '.payload.action')
                TITLE=$(_jq '.payload.issue.title' | head -c 60)
                ACTIVITY="${ACTIVITY}* ❗ ${ACTION^} issue \"${TITLE}\" in [${REPO}](https://github.com/${REPO})
        "
                ;;
              PullRequestEvent)
                COUNT=$((COUNT+1))
                ACTION=$(_jq '.payload.action')
                PR_TITLE=$(_jq '.payload.pull_request.title' | head -c 60)
                ACTIVITY="${ACTIVITY}* 🔀 ${ACTION^} PR \"${PR_TITLE}\" in [${REPO}](https://github.com/${REPO})
        "
                ;;
              ReleaseEvent)
                COUNT=$((COUNT+1))
                TAG=$(_jq '.payload.release.tag_name')
                ACTIVITY="${ACTIVITY}* 🎉 Released ${TAG} in [${REPO}](https://github.com/${REPO})
        "
                ;;
              ForkEvent)
                COUNT=$((COUNT+1))
                FORKEE=$(echo "$(_jq '.payload.forkee.full_name')")
                ACTIVITY="${ACTIVITY}* 🍴 Forked [${FORKEE}](https://github.com/${FORKEE})
        "
                ;;
              WatchEvent)
                COUNT=$((COUNT+1))
                ACTIVITY="${ACTIVITY}* ⭐ Starred [${REPO}](https://github.com/${REPO})
        "
                ;;
            esac
          done

          if [ -z "$ACTIVITY" ]; then
            ACTIVITY="*No hay actividad reciente para mostrar.*
        "
          fi

          # ── Actualizar README entre los marcadores ──────────
          perl -i -0pe 's|<!--START_SECTION:activity-->.*?<!--END_SECTION:activity-->|<!--START_SECTION:activity-->
        '"$ACTIVITY"'<!--END_SECTION:activity-->|s' README.md

          echo "✅ README actualizado con ${COUNT} eventos"

      - name: 📦 Commit actividad
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --quiet && git diff --staged --quiet || git commit -m "⚡ Actualizar actividad reciente"
          git push
        continue-on-error: true
        
