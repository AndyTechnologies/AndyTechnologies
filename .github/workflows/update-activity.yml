name: 🔄 Actualizar Perfil

on:
  schedule:
    - cron: "0 0 * * 0"   # Domingo a las 00:00 UTC
  push:
    branches: [main]
  workflow_dispatch:

# ─── Variables de entorno para steps con Node < 24 ───
env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # ────────────────────────────────────────────────────
      # 1. CHECKOUT
      # ────────────────────────────────────────────────────
      - name: 🔽 Checkout
        uses: actions/checkout@v4

      # ────────────────────────────────────────────────────
      # 2. COMMIT Y PUSH
      # ────────────────────────────────────────────────────
      - name: 📦 Commit y push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --quiet --staged; then
            git commit -m "⚡ Actualizar perfil automáticamente"
            if git pull --rebase origin main 2>/dev/null; then
              git push
            else
              git rebase --abort 2>/dev/null || true
              echo "⚠️ Conflicto en rebase con remote — push omitido. Próximo run lo resolverá."
            fi
          fi
