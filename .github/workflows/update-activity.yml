name: 🔄 Actualizar Perfil

on:
  schedule:
    - cron: "0 0 * * 0"   # Domingo a las 00:00 UTC
  push:
    branches: [main]
  workflow_dispatch:

# ─── Variables de entorno para steps con Node < 24 ───
env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # ────────────────────────────────────────────────────
      # 1. CHECKOUT
      # ────────────────────────────────────────────────────
      - name: 🔽 Checkout
        uses: actions/checkout@v4

      # ────────────────────────────────────────────────────
      # 2. CONTRIBUTION SNAKE 🐍
      # ────────────────────────────────────────────────────
      - name: 🐍 Contribution Snake
        uses: Platane/snk@v3
        with:
          github_user_name: AndyTechnologies
          outputs: |
            github-snake.svg
            github-snake-dark.svg?palette=github-dark
        continue-on-error: true

      # ────────────────────────────────────────────────────
      # 3. DASHBOARD — Stats resumidas desde API
      # ────────────────────────────────────────────────────
      - name: 📈 Generar dashboard de perfil
        shell: bash
        run: |
          NL=$'\n'

          # Obtener perfil del usuario
          USER=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/user")
          PUBLIC_REPOS=$(echo "$USER" | jq -r '.public_repos // "?"')
          FOLLOWERS=$(echo "$USER" | jq -r '.followers // "?"')
          FOLLOWING=$(echo "$USER" | jq -r '.following // "?"')

          # Obtener estrellas totales
          ALL_REPOS=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/users/AndyTechnologies/repos?per_page=100&sort=updated")
          TOTAL_STARS=$(echo "$ALL_REPOS" | jq '[.[] | .stargazers_count] | add // 0')
          TOTAL_FORKS=$(echo "$ALL_REPOS" | jq '[.[] | .forks_count] | add // 0')
          TOP_REPO=$(echo "$ALL_REPOS" | jq -r 'sort_by(.stargazers_count) | reverse | .[0] // empty | .name // "—"')

          # Estadísticas de commits del último año
          YEAR=$(date +%Y)
          COMMITS_THIS_YEAR=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/search/commits?q=author:AndyTechnologies+committer-date:${YEAR}-01-01..${YEAR}-12-31&per_page=1" \
            -H "Accept: application/vnd.github.cloak-preview" 2>/dev/null \
            | jq -r '.total_count // "?"')

          DASHBOARD=""
          DASHBOARD="${DASHBOARD}${NL}<pre>"
          DASHBOARD="${DASHBOARD}${NL}📦  Repositorios:     ${PUBLIC_REPOS}"
          DASHBOARD="${DASHBOARD}${NL}⭐  Estrellas totales: ${TOTAL_STARS}"
          DASHBOARD="${DASHBOARD}${NL}🍴  Forks totales:     ${TOTAL_FORKS}"
          DASHBOARD="${DASHBOARD}${NL}👥  Seguidores:        ${FOLLOWERS}"
          DASHBOARD="${DASHBOARD}${NL}🔄  Siguiendo:         ${FOLLOWING}"
          DASHBOARD="${DASHBOARD}${NL}📝  Commits (${YEAR}):   ${COMMITS_THIS_YEAR}"
          DASHBOARD="${DASHBOARD}${NL}🏆  Más destacado:     ${TOP_REPO}"
          DASHBOARD="${DASHBOARD}${NL}</pre>"
          DASHBOARD="${DASHBOARD}${NL}"

          perl -i -0pe \
            's|<!--DASHBOARD_START-->.*?<!--DASHBOARD_END-->|<!--DASHBOARD_START-->'"$DASHBOARD"'<!--DASHBOARD_END-->|s' \
            README.md
          echo "✅ Dashboard generado"

      # ────────────────────────────────────────────────────
      # 4. COMMIT Y PUSH — Todo en uno
      # ────────────────────────────────────────────────────
      - name: 📦 Commit y push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --quiet --staged; then
            git commit -m "⚡ Actualizar perfil automáticamente"
            if git pull --rebase origin main 2>/dev/null; then
              git push
            else
              git rebase --abort 2>/dev/null || true
              echo "⚠️ Conflicto en rebase con remote — push omitido. Próximo run lo resolverá."
            fi
          fi
