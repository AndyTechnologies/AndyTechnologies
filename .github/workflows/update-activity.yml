name: 🔄 Actualizar Perfil

on:
  schedule:
    - cron: "0 0 * * 0"   # Domingo a las 00:00 UTC
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ─── Generar métricas SVG ───────────────────────────
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 🔽 Checkout
        uses: actions/checkout@v4

      - name: 📊 Generar métricas
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          base: header, activity, community, repositories, metadata
          base_indepth: yes
          plugin_languages: yes
          plugin_languages_details: bytes, percentage
          plugin_languages_limit: 6

      - name: 📦 Commit metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics.svg
          git diff --quiet && git diff --staged --quiet || git commit -m "⚡ Actualizar métricas del perfil"
          git push
        continue-on-error: true

  # ─── Actualizar actividad reciente ─────────────────
  activity:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 🔽 Checkout
        uses: actions/checkout@v4

      - name: 📋 Actualizar actividad en README
        uses: jamesgeorge007/github-activity-readme@master
        with:
          GH_USERNAME: AndyTechnologies
          COMMIT_MSG: "⚡ Actualizar actividad reciente"
          MAX_LINES: 15
          FILTER_EVENTS: PushEvent,IssueCommentEvent,IssuesEvent,PullRequestEvent,ReleaseEvent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
